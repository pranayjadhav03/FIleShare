{% extends 'core/base.html' %}
{% block title %}Password Required{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">
    <h2 class="text-lg font-semibold mb-4">This file is password protected</h2>
    <form method="post">
        {% csrf_token %}
        <input type="password" name="password" placeholder="Enter password" class="w-full p-2 border rounded mb-4" required>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Submit</button>
    </form>
</div>
{% endblock %}
